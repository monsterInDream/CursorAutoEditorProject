name: Auto Release CI/CD
# 触发条件
on:
  push:
    branches:
      - develop
      - qa
      - product

jobs:

  # ========== Android：==========
  android-build-release:
    # 使用 Ubuntu Linux 虚拟机
    runs-on: ubuntu-latest

    # 执行步骤（按顺序）
    steps:
      # 1. 拉取 GitHub 仓库代码（含 keystore.properties 与 release keystore）
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. 安装 Node.js（React Native 打包依赖 Node）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 缓存 npm 依赖，加快后续构建
          cache: npm

      # 3. 安装 Java 17（Android Gradle Plugin 8+ 推荐）
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. 安装 Android SDK / 接受许可证（ubuntu-latest 默认无完整 SDK）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. 安装 npm 依赖（使用 package-lock.json，构建可复现）
      - name: Install Dependencies
        run: npm ci

      # 6. 为 gradlew 添加可执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 7. develop 分支
      # 7.1 构建 Release APK（versionCode使用 run_number，short code使用自增，避免版本冲突）
      - name: Build Android Release APK
        if: github.ref == 'refs/heads/develop'
        run: |
          cd android
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }}

      # 7.2 将 APK 上传为 GitHub Actions Artifact，便于下载
      - name: Upload APK Artifact
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # 7.3 在 Summary 中输出 APK 下载入口（需登录 GitHub，在 Artifacts 中下载）
      - name: Print APK download info
        if: github.ref == 'refs/heads/develop'
        run: |
          echo "### APK 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact 名称:** \`app-release-apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **下载方式:** 打开下方运行页，在页面底部 **Artifacts** 区域下载" >> $GITHUB_STEP_SUMMARY
          echo "- **运行页:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
       
      # 8.qa分支
      # 8.1 构建 Release AAB（versionCode使用 run_number，short code自增，避免版本冲突）
      - name: Build Android Release AAB
        if: github.ref == 'refs/heads/qa'
        run: |
          cd android
          ./gradlew bundleRelease -PversionCode=${{ github.run_number }}

      # 8.2 将 AAB 上传为 GitHub Actions Artifact，便于下载
      - name: Upload AAB Artifact
        if: github.ref == 'refs/heads/qa'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      # 8.3 上传 AAB 到 Google Play 内部测试轨道
      - name: Upload to Google Play Internal Testing
        if: github.ref == 'refs/heads/qa'
        uses: r0adkll/upload-google-play@v1
        with:
          # 在仓库 Settings → Secrets 中配置 GOOGLE_SERVICE_ACCOUNT_JSON
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.cursorautoeditorproject
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal

      # 9.product分支
      # 9.1 构建 Release AAB（versionCode使用 run_number，short code使用自增，避免版本冲突）
      - name: Build Android Release AAB
        if: github.ref == 'refs/heads/product'
        run: |
          cd android
          ./gradlew bundleRelease -PversionCode=${{ github.run_number }}

      # 9.2 将 AAB 上传为 GitHub Actions Artifact，便于下载
      - name: Upload AAB Artifact
        if: github.ref == 'refs/heads/product'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      # 9.3 上传 AAB 到 Google Play 正式版轨道
      - name: Upload to Google Play Production
        if: github.ref == 'refs/heads/product'
        uses: r0adkll/upload-google-play@v1
        with:
          # 在仓库 Settings → Secrets 中配置 GOOGLE_SERVICE_ACCOUNT_JSON
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.cursorautoeditorproject
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: production
          status: completed

  # ========== iOS：真机 Release 包 + TestFlight（须 macOS Runner）==========
  ios-build-release:
    runs-on: macos-latest

    steps:
      # iOS-1. 拉取仓库代码
      - name: Checkout Source
        uses: actions/checkout@v4

      # iOS-2. Node.js（React Native 打 JS Bundle）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # iOS-3. 安装 npm 依赖
      - name: Install Dependencies
        run: npm ci

      # iOS-4. CocoaPods（RN iOS 原生依赖）
      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      # iOS-5. 创建临时 Keychain（CI 无交互，须单独钥匙串导入 p12）
      - name: Create Temporary Keychain
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=actions
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      # iOS-6. 从 Secret 恢复 Apple Distribution 证书（.p12）
      - name: Install Distribution Certificate
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$P12_BASE64" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild
          # 允许 codesign 在无 UI 的 Runner 上使用证书
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # iOS-7. 安装描述文件，并解析 UUID / 名称 / Bundle ID（须与 App Store Connect 一致）
      - name: Install Provisioning Profile
        env:
          PROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          APPSTORE_TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPSTORE_TEAM_ID:-}" ]; then
            echo "Error: 请在 Secrets 中配置 APPSTORE_TEAM_ID（10 位 Team ID）。"
            exit 1
          fi
          echo "APPSTORE_TEAM_ID=$APPSTORE_TEAM_ID" >> "$GITHUB_ENV"

          printf '%s' "$PROVISION_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"

          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          BUNDLE_ID="${APP_ID#*.}"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"

          echo "IOS_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "IOS_BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "Profile: $PROFILE_NAME ($UUID)"
          echo "Bundle ID: $BUNDLE_ID"

      # iOS-8. App Store Connect API Key（供 altool 读取：AuthKey_<KEY_ID>.p8）
      - name: Install App Store Connect API Key
        env:
          API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_FILE=~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8
          printf '%s' "$API_KEY_BASE64" | base64 -D > "$KEY_FILE"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_FILE"; then
            echo "Error: APPSTORE_API_KEY_BASE64 无效，请用 base64 -i AuthKey_xxx.p8 重新生成。"
            exit 1
          fi

      # iOS-9. Archive（develop / qa / product 共用；Build 号 = run_number）
      - name: Archive iOS Release
        if: |
          github.ref == 'refs/heads/develop' ||
          github.ref == 'refs/heads/qa' ||
          github.ref == 'refs/heads/product'
        run: |
          set -euo pipefail
          mkdir -p ios/build
          xcodebuild \
            -workspace ios/CursorAutoEditorProject.xcworkspace \
            -scheme CursorAutoEditorProject \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/build/CursorAutoEditorProject.xcarchive \
            archive \
            DEVELOPMENT_TEAM="$APPSTORE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$IOS_PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # iOS-10. 导出 App Store IPA（manual 导出须指定 provisioningProfiles）
      - name: Export IPA
        if: |
          github.ref == 'refs/heads/develop' ||
          github.ref == 'refs/heads/qa' ||
          github.ref == 'refs/heads/product'
        run: |
          set -euo pipefail
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPSTORE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${IOS_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath ios/build/CursorAutoEditorProject.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath ios/build
          IPA_PATH=$(find ios/build -name '*.ipa' | head -1)
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          ls -la ios/build

      # iOS-11. 上传 IPA 到 Actions Artifact（便于下载）
      - name: Upload IPA Artifact
        if: |
          github.ref == 'refs/heads/develop' ||
          github.ref == 'refs/heads/qa' ||
          github.ref == 'refs/heads/product'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ env.IPA_PATH }}

      # iOS-12. 上传到 TestFlight（altool 自动读取 ~/.appstoreconnect/private_keys/AuthKey_*.p8）
      - name: Upload to TestFlight
        if: |
          github.ref == 'refs/heads/develop' ||
          github.ref == 'refs/heads/qa' ||
          github.ref == 'refs/heads/product'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"
