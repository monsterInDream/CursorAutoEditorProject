name: Auto Release CI/CD
# 触发条件
on:
  push:
    branches:
      - develop
      - qa
      - product

jobs:
  android-build-release:
    # 使用 Ubuntu Linux 虚拟机
    runs-on: ubuntu-latest

    # 执行步骤（按顺序）
    steps:
      # 1. 拉取 GitHub 仓库代码（含 keystore.properties 与 release keystore）
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. 安装 Node.js（React Native 打包依赖 Node）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 缓存 npm 依赖，加快后续构建
          cache: npm

      # 3. 安装 Java 17（Android Gradle Plugin 8+ 推荐）
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. 安装 Android SDK / 接受许可证（ubuntu-latest 默认无完整 SDK）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. 安装 npm 依赖（使用 package-lock.json，构建可复现）
      - name: Install Dependencies
        run: npm ci

      # 6. 为 gradlew 添加可执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 7. develop 分支
      # 7.1 构建 Release APK（versionCode使用 run_number，short code使用自增，避免版本冲突）
      - name: Build Android Release APK
        if: github.ref == 'refs/heads/develop'
        run: |
          cd android
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }}

      # 7.2 将 APK 上传为 GitHub Actions Artifact，便于下载
      - name: Upload APK Artifact
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # 7.3 在 Summary 中输出 APK 下载入口（需登录 GitHub，在 Artifacts 中下载）
      - name: Print APK download info
        if: github.ref == 'refs/heads/develop'
        run: |
          echo "### APK 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact 名称:** \`app-release-apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **下载方式:** 打开下方运行页，在页面底部 **Artifacts** 区域下载" >> $GITHUB_STEP_SUMMARY
          echo "- **运行页:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
       
      # 8.qa分支
      # 8.1 构建 Release AAB（versionCode使用 run_number，short code自增，避免版本冲突）
      - name: Build Android Release AAB
        if: github.ref == 'refs/heads/qa'
        run: |
          cd android
          ./gradlew bundleRelease -PversionCode=${{ github.run_number }}

      # 8.2 将 AAB 上传为 GitHub Actions Artifact，便于下载
      - name: Upload AAB Artifact
        if: github.ref == 'refs/heads/qa'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      # 8.3 上传 AAB 到 Google Play 内部测试轨道
      - name: Upload to Google Play Internal Testing
        if: github.ref == 'refs/heads/qa'
        uses: r0adkll/upload-google-play@v1
        with:
          # 在仓库 Settings → Secrets 中配置 GOOGLE_SERVICE_ACCOUNT_JSON
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.cursorautoeditorproject
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal

      # 9.product分支
      # 9.1 构建 Release AAB（versionCode使用 run_number，short code使用自增，避免版本冲突）
      - name: Build Android Release AAB
        if: github.ref == 'refs/heads/product'
        run: |
          cd android
          ./gradlew bundleRelease -PversionCode=${{ github.run_number }}

      # 9.2 将 AAB 上传为 GitHub Actions Artifact，便于下载
      - name: Upload AAB Artifact
        if: github.ref == 'refs/heads/product'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      # 9.3 上传 AAB 到 Google Play 正式版轨道
      - name: Upload to Google Play Production
        if: github.ref == 'refs/heads/product'
        uses: r0adkll/upload-google-play@v1
        with:
          # 在仓库 Settings → Secrets 中配置 GOOGLE_SERVICE_ACCOUNT_JSON
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.cursorautoeditorproject
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: production
          status: completed

  # ========== iOS：iPad / iPhone 真机包 + 上传 App Store Connect ==========
  ios-build-release:
    # 必须使用 macOS（iOS 无法在 ubuntu 上编译）
    runs-on: macos-latest

    steps:
      # 1. 拉取代码
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Node（React Native 打包 JS）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. 安装 npm 依赖
      - name: Install Dependencies
        run: npm ci

      # 4. 导入 p12 签名证书到临时钥匙串
      - name: Install signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=actions
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN
          security list-keychain -d user -s $KEYCHAIN
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN

      # 5. 安装描述文件（.mobileprovision）
      - name: Install provisioning profile
        env:
          PROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISION_BASE64" | base64 --decode > /tmp/app.mobileprovision
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i /tmp/app.mobileprovision)")
          cp /tmp/app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      # 6. CocoaPods
      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      # 7. 解码 App Store Connect API Key（.p8）
      - name: Decode App Store Connect API key
        run: |
          echo "${{ secrets.APPSTORE_API_KEY_BASE64 }}" | base64 --decode > $RUNNER_TEMP/AuthKey.p8

      # 8. develop分支：打包并上传 App Store Connect
      - name: "[develop] Archive iOS Release"
        if: github.ref == 'refs/heads/develop'
        run: |
          cd ios
          xcodebuild -workspace CursorAutoEditorProject.xcworkspace \
            -scheme CursorAutoEditorProject \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive \
            DEVELOPMENT_TEAM=YOUR_TEAM_ID \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="YOUR_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: "[develop] Export IPA"
        if: github.ref == 'refs/heads/develop'
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>YOUR_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      - name: "[develop] Upload to App Store Connect"
        if: github.ref == 'refs/heads/develop'
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ runner.temp }}/export/CursorAutoEditorProject.ipa
          issuer-id: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_KEY_BASE64 }}

      # 9.qa：打包并上传（步骤与 develop 相同，仅 if 不同）
      - name: "[qa] Archive iOS Release"
        if: github.ref == 'refs/heads/qa'
        run: |
          cd ios
          xcodebuild -workspace CursorAutoEditorProject.xcworkspace \
            -scheme CursorAutoEditorProject \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive \
            DEVELOPMENT_TEAM=YOUR_TEAM_ID \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="YOUR_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: "[qa] Export IPA"
        if: github.ref == 'refs/heads/qa'
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>YOUR_TEAM_ID</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      - name: "[qa] Upload to App Store Connect"
        if: github.ref == 'refs/heads/qa'
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ runner.temp }}/export/CursorAutoEditorProject.ipa
          issuer-id: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_KEY_BASE64 }}

      # 9. product分支：打包并上传 App Store Connect
      - name: "[product] Archive iOS Release"
        if: github.ref == 'refs/heads/product'
        run: |
          cd ios
          xcodebuild -workspace CursorAutoEditorProject.xcworkspace \
            -scheme CursorAutoEditorProject \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive \
            DEVELOPMENT_TEAM=YOUR_TEAM_ID \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="YOUR_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: "[product] Export IPA"
        if: github.ref == 'refs/heads/product'
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>YOUR_TEAM_ID</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      - name: "[product] Upload to App Store Connect"
        if: github.ref == 'refs/heads/product'
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ runner.temp }}/export/CursorAutoEditorProject.ipa
          issuer-id: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_KEY_BASE64 }}