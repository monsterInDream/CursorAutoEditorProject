name: Auto Release CI/CD
# 触发条件
on:
  push:
    branches:
      - develop
      - qa
      - product

jobs:

  # ========== Android：==========
  android-build-release:
    # 使用 Ubuntu Linux 虚拟机
    runs-on: ubuntu-latest

    # 执行步骤（按顺序）
    steps:
      # 1. 拉取 GitHub 仓库代码（含 keystore.properties 与 release keystore）
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. 安装 Node.js（React Native 打包依赖 Node）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 缓存 npm 依赖，加快后续构建
          cache: npm

      # 3. 安装 Java 17（Android Gradle Plugin 8+ 推荐）
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. 安装 Android SDK / 接受许可证（ubuntu-latest 默认无完整 SDK）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. 安装 npm 依赖（使用 package-lock.json，构建可复现）
      - name: Install Dependencies
        run: npm ci

      # 6. 为 gradlew 添加可执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 6.1 从 build.gradle 读取 versionName（versionCode 使用 run_number）
      - name: Read Android version
        run: |
          VERSION_NAME=$(grep -m1 'versionName' android/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      # 7. develop 分支
      # 7.1 构建 Release APK（versionCode使用 run_number，short code使用自增，避免版本冲突）
      - name: Build Android Release APK
        if: github.ref == 'refs/heads/develop'
        run: |
          cd android
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }}

      # 7.2 输出 APK 版本号
      - name: Print APK version
        if: github.ref == 'refs/heads/develop'
        run: |
          echo "this apk is ${APP_VERSION_NAME}(${APP_VERSION_CODE})"
          echo "### APK 构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**this apk is ${APP_VERSION_NAME}(${APP_VERSION_CODE})**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      # 7.3 将 APK 上传为 GitHub Actions Artifact，便于下载
      - name: Upload APK Artifact
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # 7.4 在 Summary 中输出 APK 下载入口（需登录 GitHub，在 Artifacts 中下载）
      - name: Print APK download info
        if: github.ref == 'refs/heads/develop'
        run: |
          echo "- **Artifact 名称:** \`app-release-apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **下载方式:** 打开下方运行页，在页面底部 **Artifacts** 区域下载" >> "$GITHUB_STEP_SUMMARY"
          echo "- **运行页:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
       
      # 8.qa分支
      # 8.1 构建 Release AAB（versionCode使用 run_number，short code自增，避免版本冲突）
      - name: Build Android Release AAB
        if: github.ref == 'refs/heads/qa'
        run: |
          cd android
          ./gradlew bundleRelease -PversionCode=${{ github.run_number }}

      # 8.2 输出 AAB 版本号（qa）
      - name: Print AAB version
        if: github.ref == 'refs/heads/qa'
        run: |
          echo "this aab is ${APP_VERSION_NAME}(${APP_VERSION_CODE})"
          echo "### AAB 构建完成 (qa)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**this aab is ${APP_VERSION_NAME}(${APP_VERSION_CODE})**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      # 8.3 将 AAB 上传为 GitHub Actions Artifact，便于下载
      - name: Upload AAB Artifact
        if: github.ref == 'refs/heads/qa'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      # 8.4 上传 AAB 到 Google Play 内部测试轨道
      - name: Upload to Google Play Internal Testing
        if: github.ref == 'refs/heads/qa'
        uses: r0adkll/upload-google-play@v1
        with:
          # 在仓库 Settings → Secrets 中配置 GOOGLE_SERVICE_ACCOUNT_JSON
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.cursorautoeditorproject
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal

      # 9.product分支
      # 9.1 构建 Release AAB（versionCode使用 run_number，short code使用自增，避免版本冲突）
      - name: Build Android Release AAB
        if: github.ref == 'refs/heads/product'
        run: |
          cd android
          ./gradlew bundleRelease -PversionCode=${{ github.run_number }}

      # 9.2 输出 AAB 版本号（product）
      - name: Print AAB version
        if: github.ref == 'refs/heads/product'
        run: |
          echo "this aab is ${APP_VERSION_NAME}(${APP_VERSION_CODE})"
          echo "### AAB 构建完成 (product)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**this aab is ${APP_VERSION_NAME}(${APP_VERSION_CODE})**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      # 9.3 将 AAB 上传为 GitHub Actions Artifact，便于下载
      - name: Upload AAB Artifact
        if: github.ref == 'refs/heads/product'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      # 9.4 上传 AAB 到 Google Play 正式版轨道
      - name: Upload to Google Play Production
        if: github.ref == 'refs/heads/product'
        uses: r0adkll/upload-google-play@v1
        with:
          # 在仓库 Settings → Secrets 中配置 GOOGLE_SERVICE_ACCOUNT_JSON
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.cursorautoeditorproject
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: production
          status: completed

  # ========== iOS：真机 Release 包 + TestFlight（须 macOS Runner）==========
  ios-build-release:
    # 必须使用 iOS 26 SDK（Xcode 26+）
    runs-on: macos-26

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. App Store 要求使用 iOS 26 SDK（Xcode 26+）；macos-26 镜像提供 26.4.1
      - name: Select Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      # 2.2. 显示 Xcode 版本
      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos || true

      # 3. 安装Node.js（React Native 打 JS Bundle）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 4. 安装 npm 依赖
      - name: Install Dependencies
        run: npm ci

      # 从 Xcode 工程读取 MARKETING_VERSION（Build 号使用 run_number）
      - name: Read iOS version
        run: |
          VERSION_NAME=$(grep -m1 'MARKETING_VERSION' ios/CursorAutoEditorProject.xcodeproj/project.pbxproj | sed -E 's/.*= ([^;]+);/\1/' | tr -d ' ')
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      # 让 Xcode 脚本阶段能找到 node（Bundle React Native code and images）
      - name: Configure Node for Xcode
        run: echo "export NODE_BINARY=$(command -v node)" > ios/.xcode.env.local

      # 5. Xcode 26.4+ 须 fmt 12.1.0（RN 0.78 自带 11.0.2 在 Clang 21 下无法编译 format.cc）
      - name: Patch fmt for Xcode 26
        run: |
          set -euo pipefail
          FMT_SPEC=node_modules/react-native/third-party-podspecs/fmt.podspec
          sed -i '' 's/11.0.2/12.1.0/g' "$FMT_SPEC"
          grep -E 'spec.version|:tag' "$FMT_SPEC"

      - name: Install CocoaPods
        env:
          LANG: en_US.UTF-8
        run: |
          set -euo pipefail
          sed -i '' 's/fmt (11.0.2)/fmt (12.1.0)/g' ios/Podfile.lock
          sed -i '' 's/fmt (= 11.0.2)/fmt (= 12.1.0)/g' ios/Podfile.lock
          cd ios
          rm -rf Pods
          pod install --repo-update

      # 6. 创建临时 Keychain（CI 无交互，须单独钥匙串导入 p12）
      - name: Create Temporary Keychain
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=actions
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      # 7. 从 Secret 恢复 Apple Distribution 证书（.p12）
      - name: Install Distribution Certificate
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$P12_BASE64" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild
          # 允许 codesign 在无 UI 的 Runner 上使用证书
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # 8. 安装描述文件，并解析 UUID / 名称 / Bundle ID（须与 App Store Connect 一致）
      - name: Install Provisioning Profile
        env:
          PROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          APPSTORE_TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPSTORE_TEAM_ID:-}" ]; then
            echo "Error: 请在 Secrets 中配置 APPSTORE_TEAM_ID（10 位 Team ID）。"
            exit 1
          fi
          echo "APPSTORE_TEAM_ID=$APPSTORE_TEAM_ID" >> "$GITHUB_ENV"

          printf '%s' "$PROVISION_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"

          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          BUNDLE_ID="${APP_ID#*.}"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"

          echo "IOS_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "IOS_BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "Profile: $PROFILE_NAME ($UUID)"
          echo "Bundle ID: $BUNDLE_ID"

      # 9. App Store Connect API Key（供 altool 读取：AuthKey_<KEY_ID>.p8）
      - name: Install App Store Connect API Key
        env:
          API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_FILE=~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8
          printf '%s' "$API_KEY_BASE64" | base64 -D > "$KEY_FILE"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_FILE"; then
            echo "Error: APPSTORE_API_KEY_BASE64 无效，请用 base64 -i AuthKey_xxx.p8 重新生成。"
            exit 1
          fi

      # 10. Archive（develop / qa / product 共用；Build 号 = run_number）
      - name: Archive iOS Release
        if: |
          github.ref == 'refs/heads/develop' ||
          github.ref == 'refs/heads/qa' ||
          github.ref == 'refs/heads/product'
        run: |
          set -euo pipefail
          mkdir -p ios/build
          set -o pipefail
          xcodebuild \
            -workspace ios/CursorAutoEditorProject.xcworkspace \
            -scheme CursorAutoEditorProject \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/build/CursorAutoEditorProject.xcarchive \
            archive \
            DEVELOPMENT_TEAM="$APPSTORE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$IOS_PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            2>&1 | tee ios/build/xcodebuild-archive.log
          echo "--- 若失败，请在本日志中搜索 error: ---"
          grep -i "error:" ios/build/xcodebuild-archive.log | tail -20 || true

      # 11. 导出 App Store IPA（manual 导出须指定 provisioningProfiles）
      - name: Export IPA
        if: |
          github.ref == 'refs/heads/develop' ||
          github.ref == 'refs/heads/qa' ||
          github.ref == 'refs/heads/product'
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import os
          import plistlib
          plist = {
              "method": "app-store",
              "signingStyle": "manual",
              "teamID": os.environ["APPSTORE_TEAM_ID"],
              "uploadSymbols": True,
              "provisioningProfiles": {
                  os.environ["IOS_BUNDLE_ID"]: os.environ["IOS_PROFILE_NAME"],
              },
          }
          with open("ios/ExportOptions.plist", "wb") as f:
              plistlib.dump(plist, f)
          PY
          xcodebuild \
            -exportArchive \
            -archivePath ios/build/CursorAutoEditorProject.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath ios/build
          IPA_PATH=$(find ios/build -name '*.ipa' | head -1)
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          ls -la ios/build

      # 输出 IPA 版本号
      - name: Print IPA version
        if: |
          github.ref == 'refs/heads/develop' ||
          github.ref == 'refs/heads/qa' ||
          github.ref == 'refs/heads/product'
        run: |
          echo "this ipa is ${APP_VERSION_NAME}(${APP_VERSION_CODE})"
          echo "### IPA 构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**this ipa is ${APP_VERSION_NAME}(${APP_VERSION_CODE})**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      # 12. 上传 IPA 到 Actions Artifact（便于下载）
      - name: Upload IPA Artifact
        if: |
          github.ref == 'refs/heads/develop' ||
          github.ref == 'refs/heads/qa' ||
          github.ref == 'refs/heads/product'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ env.IPA_PATH }}

      # 13. 上传到 TestFlight（altool 自动读取 ~/.appstoreconnect/private_keys/AuthKey_*.p8）
      - name: Upload to TestFlight
        if: |
          github.ref == 'refs/heads/develop' ||
          github.ref == 'refs/heads/qa' ||
          github.ref == 'refs/heads/product'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"
